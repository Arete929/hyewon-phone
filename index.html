<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#27187E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="혜원이지">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>혜원이지</title>
<style>
/* ── 색 ────────────────────────────────────────────────────
   진호알리미·혜원이지의 «고스트» 를 그대로 가져왔다. 폰에서도 같은 집이어야 한다.
   어두운 화면을 쓰는 분을 위해 밤 색도 같이 둔다. */
:root{
  --bg:#F7F7FF; --fg:#27187E; --accent:#27187E; --on:#F7F7FF;
  --card:#E4E0F5; --card2:#D5D0EC; --line:#B4ACDD; --dim:#5F5798; --fg2:#3A2E8E;
  --ok:#0E7C58; --warn:#B3541E;
  --pad:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15161f; --fg:#E9E8F7; --accent:#A79BFF; --on:#15161f;
    --card:#242737; --card2:#2F3348; --line:#414665; --dim:#A5A3C6; --fg2:#CFCCEC;
    --ok:#4FD1A0; --warn:#FFB27A;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}

/* ── 머리 ─────────────────────────────────────────────── */
.top{
  position:sticky; top:0; z-index:9; background:var(--bg);
  display:flex; align-items:center; gap:10px;
  padding:14px var(--pad) 10px; border-bottom:1px solid var(--line);
}
.top .logo{width:32px;height:32px;flex:none;object-fit:contain;margin-right:-2px}
.top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.5px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .back{
  background:none;border:0;padding:6px 8px 6px 0;font-size:20px;line-height:1;cursor:pointer;color:var(--accent);
}
.top .act{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;font-size:12px;font-weight:700;color:var(--fg2);cursor:pointer;
}
.wrap{padding:var(--pad) var(--pad) calc(86px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:var(--bg);border-top:1px solid var(--line);
  padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;padding:5px 0;color:var(--dim);font-size:10.5px;font-weight:700;
  letter-spacing:-.3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav button .li{width:23px;height:23px;display:block}
.nav button.on{color:var(--accent)}
.nav button.on span{font-weight:800}

/* ── 오늘 띠 ──────────────────────────────────────────── */
.dayline{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  margin-bottom:14px;
}
.dayline b{font-size:22px;font-weight:800;letter-spacing:-.6px}
.dayline span{font-size:13px;color:var(--dim)}
.dayline em{
  font-style:normal;font-size:12px;font-weight:800;color:var(--on);background:var(--accent);
  border-radius:999px;padding:2px 9px;
}

/* ── 타일 격자 (고르신 시안) ───────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.tile{
  display:flex;flex-direction:column;gap:7px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 14px 15px;cursor:pointer;min-height:112px;
  transition:transform .08s,border-color .12s;
}
.tile:active{transform:scale(.975)}
.tile.wide{grid-column:1/-1;min-height:0}
.tile .ic{display:block;line-height:1;color:var(--accent)}
.tile .ic .li{width:28px;height:28px;display:block}
.tile .tt{font-size:14px;font-weight:800;letter-spacing:-.3px}
.tile .td{font-size:12.5px;color:var(--dim);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .td b{color:var(--fg2);font-weight:800}
.tile.none{opacity:.55}

/* ── 목록·카드 ───────────────────────────────────────── */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:11px;
}
.card h2{margin:0 0 8px;font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.2px}
.row{display:flex;gap:9px;align-items:baseline;padding:6px 0}
.row+.row{border-top:1px solid var(--line)}
.row i{font-style:normal;font-size:12px;font-weight:800;color:var(--accent);flex:0 0 auto;min-width:38px}
.row b{font-weight:800;flex:0 0 auto}
.row span{color:var(--fg2);min-width:0;font-size:14px}
.muted{color:var(--dim);font-size:13.5px}
.empty{text-align:center;color:var(--dim);padding:34px 10px;font-size:14px;line-height:1.7}

/* ── 시간표 표 ───────────────────────────────────────── */
.tt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tt{border-collapse:collapse;width:100%;min-width:330px;font-size:12px}
table.tt th,table.tt td{
  border:1px solid var(--line);padding:5px 3px;text-align:center;vertical-align:middle;
}
table.tt th{background:var(--card2);font-weight:800;font-size:11.5px;color:var(--fg2)}
table.tt td{height:44px}
table.tt td.on{background:var(--card)}
table.tt td b{display:block;font-size:12.5px;font-weight:800}
table.tt td u{display:block;text-decoration:none;font-size:10.5px;color:var(--dim);margin-top:1px}
table.tt col.today,table.tt th.today{background:color-mix(in srgb,var(--accent) 16%,transparent)}
table.tt td.today{background:color-mix(in srgb,var(--accent) 9%,var(--card))}

/* ── 급식 ────────────────────────────────────────────── */
.meal .day{font-size:13px;font-weight:800;color:var(--dim);margin-bottom:5px}
.meal .day em{font-style:normal;font-weight:700;margin-left:7px;opacity:.75}
.meal .dishes{display:flex;flex-wrap:wrap;gap:5px 12px}
.meal .dishes span{font-size:14.5px;font-weight:600}

/* ── 주간업무 ────────────────────────────────────────── */
.dept{margin-bottom:12px}
.dept>h3{
  margin:0 0 6px;font-size:14px;font-weight:800;color:var(--fg);
  background:color-mix(in srgb,var(--accent) 11%,transparent);
  border-radius:8px;padding:5px 10px;
}
.dept p{margin:0;font-size:14px;line-height:1.7;color:var(--fg2);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.dept p.c{text-align:center}
.dept p.r{text-align:right}
.dept a{color:var(--accent);font-weight:700}
/* 번호·기호는 따로 떼어 «내어쓰기» — 줄이 넘어가도 글자가 기호 밑으로 안 파고든다 */
.dept p.li{display:flex;gap:6px;margin-top:3px}
.dept p.li .mk{flex:none;min-width:1.5em;font-weight:700;color:var(--fg)}
.dept p.li .tx{flex:1;min-width:0}
.dept p.l0{margin-top:14px;font-weight:700;color:var(--fg)}
.dept p.l0:first-of-type{margin-top:4px}
.dept p.l1{margin-left:12px}
.dept p.l2{margin-left:26px;font-size:13.5px}
.dept p.l3{margin-left:40px;font-size:13px;color:var(--dim)}
.dept p.sp{height:6px}
/* 표 — ★ 칸 안 글은 «원래 줄바꿈이 있는 곳» 에서만 줄을 바꾼다(white-space:pre). 자동으로 꺾지 않고, 넓으면 표를 좌우로 밀어 본다 */
.dept .tbw{overflow-x:auto;margin:8px 0;border-radius:8px;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
.dept table{border-collapse:collapse;width:100%;font-size:12.5px;line-height:1.55}
.dept table td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;white-space:pre;border-top:0;border-left:0}
.dept table tr:last-child td{border-bottom:0}
.dept table td:last-child{border-right:0}
.dept table td.nw{text-align:center;vertical-align:middle}
.dept table td.hd{background:var(--card2);color:var(--fg);font-weight:800;text-align:center;vertical-align:middle}
.dept table tr:nth-child(even) td:not(.hd){background:color-mix(in srgb,var(--accent) 4%,transparent)}
.dept table td p{font-size:12.5px;line-height:1.55;margin:0;white-space:pre;word-break:normal;overflow-wrap:normal}
.dept table td p.c{text-align:center}
.dept .tbw .tbw{margin:4px 0}

/* ── 바로가기 타일 ───────────────────────────────────── */
.links{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lnk{
  display:flex;flex-direction:column;gap:4px;text-align:left;
  background:var(--bg);border:1px solid var(--line);border-radius:13px;
  padding:12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.10);
}
.lnk:active{transform:scale(.975)}
.lnk b{font-size:13.5px;font-weight:800;line-height:1.35}
.lnk i{font-style:normal;font-size:11px;color:var(--dim)}

/* ── 고르개(칩) — 드롭다운은 쓰지 않는다 ────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;font-size:13px;font-weight:700;color:var(--fg2);cursor:pointer;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.fld{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;font-size:15px;margin-bottom:9px;
}

/* ── 첫 화면(암호) ───────────────────────────────────── */
.gate{max-width:340px;margin:14vh auto 0;padding:0 var(--pad);text-align:center}
.gate img{width:96px;height:96px;object-fit:contain;margin-bottom:14px}
.gate h1{font-size:23px;margin:0 0 6px;font-weight:800;letter-spacing:-.6px}
.gate p{color:var(--dim);font-size:13.5px;margin:0 0 18px;line-height:1.6}
.btn{
  width:100%;background:var(--accent);color:var(--on);border:0;border-radius:12px;
  padding:13px;font-size:15px;font-weight:800;cursor:pointer;
}
.btn.ghost{background:var(--card);color:var(--fg2);border:1px solid var(--line)}
.err{color:var(--warn);font-size:13px;margin-top:10px;min-height:18px;font-weight:700}

/* ── 새 판 띠 ────────────────────────────────────────── */
.newver{
  position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  background:var(--accent);color:var(--on);border-radius:13px;
  padding:12px 14px;display:none;align-items:center;gap:10px;z-index:50;
  box-shadow:0 6px 20px rgba(0,0,0,.28);font-size:13.5px;font-weight:700;
}
.newver button{
  margin-left:auto;background:var(--on);color:var(--accent);border:0;border-radius:9px;
  padding:7px 13px;font-weight:800;font-size:13px;cursor:pointer;
}
.foot{text-align:center;color:var(--dim);font-size:11.5px;padding:22px 0 6px;line-height:1.7}
.spin{text-align:center;color:var(--dim);padding:44px 0;font-size:14px}

/* 태블릿(갤럭시탭 S7 FE 등) — 넓으면 타일을 더 벌린다 */
@media (min-width:640px){
  :root{--pad:24px}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .links{grid-template-columns:repeat(3,1fr)}
  .wrap{max-width:900px;margin:0 auto}
  .top{max-width:900px;margin:0 auto}
}
@media (min-width:900px){
  .tiles{grid-template-columns:repeat(4,1fr)}
  .links{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div id="app"><div class="spin">불러오는 중…</div></div>

<div class="newver" id="newver">
  <span>새 판이 나왔습니다</span>
  <button type="button" id="nvBtn">지금 바꾸기</button>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   혜원이지 | @version 1.3.1
   수정요약: v1.3.1 앱 아이콘 로고를 틀 가득(높이 104%, 뾰족한 잎 끝 약간 잘림) · 아이폰용 apple-touch-icon.png 따로. / v1.3.0 하단 내비게이션 바(홈·시간표·급식·학사일정·주간업무·바로가기) · 앱 아이콘 배경을 로고 빨강(#E9030C)으로 · 앱 안 로고는 투명 logo-512.png. / v1.2.9 마스크용 아이콘 — 로고 외접원이 캔버스를 가득(99%) 채우게 키움(흰 틀이 최대한 가려지게). / v1.2.8 앱 아이콘 — 로고를 틀 가득(any 98%·maskable 안전영역 가득) 크게, 배경 투명. / v1.2.7 표 안 글은 원래 줄바꿈 자리에서만 줄바꿈(자동 꺾임 없음) — 넓으면 좌우로 밀어 봄. / v1.2.6 주간업무 읽기 쉽게 — 줄간격 넓힘·번호/기호 내어쓰기와 단계별 들여쓰기·표를 가로로 밀어 보게 하고 짧은 칸은 한 줄로·표 머리줄/줄무늬. / v1.2.5 새로고침해도 옛 판이 뜨던 것(서비스워커) 수정 — sw.js 머리말 참고. / v1.2.4 학사일정 «1년 전체» 칩 + 묵은 탭(ok:false)이 같은 달로 겹쳐 나오던 것 제거. / v1.2.3 학사일정 — 타일 이름을 «학사일정» 으로, 달 칩으로 다른 달도 본다. / v1.2.2 타일 이모지(📘🍚📅📋🔗)를 선 아이콘으로. / v1.2.1 로그인 뒤 홈 머리글에 로고 · 화면에 보이는 버전 표기를 맞춤(그전엔 1.1.0 으로 남아 있었다). / v1.2.0 로그인 화면 로고와 설치용 앱 아이콘을 «혜원» 꽃 3D 로고(투명 배경)로 · icon-192 추가. / v1.1.0 이름을 «혜원이지» 로. / v1.0.0 첫 판 — 타일 홈 + 시간표·급식·학사일정·주간업무·바로가기

   ★ 폰은 아무것도 긁지 않는다. «다리»(GAS)가 다 긁어서 정리해 준 것만 받는다.
     폰 브라우저는 남의 사이트를 직접 못 부르기 때문이다(같은 출처 규칙).
   ★ 드롭다운(select)은 쓰지 않는다 — 칩·단추로 고른다.
   ══════════════════════════════════════════════════════════ */

var VERSION = '1.3.1';
var BRIDGE = 'https://script.google.com/macros/s/'
  + 'AKfycbzsemwlt0CehxbnVofhLPRrc2jRS1oSZyOpFVUTjBnq1Kohee9RziZFYYS1qLyadBcM/exec';

var DOWN = ['일','월','화','수','목','금','토'];
var $ = function (id) { return document.getElementById(id); };
var APP = $('app');

/* ── 이 폰에 담아 두는 것 ──────────────────────────────── */
var LS = {
  get: function (k, d) {
    try { var v = localStorage.getItem('phone.' + k); return v === null ? d : v; }
    catch (e) { return d; }
  },
  set: function (k, v) { try { localStorage.setItem('phone.' + k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem('phone.' + k); } catch (e) {} }
};

var KEY = LS.get('key', '');
var ME = LS.get('me', '');          // 내 이름 (컴시간 교사 이름)
var VIEW = 'home';
var D = null;                        // 다리에서 받은 것
var ERR = '';
var LOADING = false;

/* ── 잔손 ────────────────────────────────────────────── */
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function todayStr() {
  var d = new Date();
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function todayDow() { return DOWN[new Date().getDay()]; }
function isWeekday() { var g = new Date().getDay(); return g >= 1 && g <= 5; }

/* ── 다리 부르기 ─────────────────────────────────────── */
function load(fresh) {
  if (!KEY) { VIEW = 'gate'; draw(); return; }
  LOADING = true; ERR = ''; draw();
  var u = BRIDGE + '?key=' + encodeURIComponent(KEY) + '&what=all' + (fresh ? '&fresh=1' : '');
  fetch(u, { redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      LOADING = false;
      if (!j.ok) {
        if (j.need === 'key') { KEY = ''; LS.del('key'); VIEW = 'gate'; ERR = j.error || ''; }
        else ERR = j.error || '자료를 받지 못했습니다';
        draw(); return;
      }
      D = j;
      LS.set('cache', JSON.stringify(j));
      LS.set('cacheAt', new Date().toISOString());
      draw();
    })
    .catch(function (e) {
      LOADING = false;
      /* ★ 인터넷이 없거나 다리가 죽었을 때 — 지난번에 받아 둔 것이라도 보여 준다.
         빈 화면보다 낫다. 언제 것인지는 아래에 적어 준다. */
      var c = LS.get('cache', '');
      if (c && !D) { try { D = JSON.parse(c); } catch (e2) {} }
      ERR = '지금은 못 받았습니다 — ' + ((e && e.message) || e);
      draw();
    });
}

/* ══ 화면 ═══════════════════════════════════════════════ */

/* ── 첫 화면: 암호 ───────────────────────────────────── */
function viewGate() {
  return '<div class="gate">'
    + '<img src="logo-512.png" alt="">'
    + '<h1>혜원이지</h1>'
    + '<p>혜원여자중학교 선생님용입니다. <b>폰에서 보는 혜원이지</b>입니다.<br>학교 공용 암호를 한 번만 넣으면 기억합니다.</p>'
    + '<input class="fld" id="gKey" type="password" inputmode="text"'
    + ' autocomplete="current-password" placeholder="암호">'
    + '<button class="btn" id="gGo">들어가기</button>'
    + '<div class="err">' + esc(ERR) + '</div>'
    + '</div>';
}

/* ── 오늘 내 수업 ────────────────────────────────────── */
function myDays() {
  if (!D || !D.tt || !ME) return null;
  var list = D.tt.byTeacher || [];
  for (var i = 0; i < list.length; i++) if (list[i].name === ME) return list[i];
  return null;
}
function myToday() {
  var t = myDays();
  if (!t) return [];
  var dow = todayDow();
  for (var i = 0; i < t.days.length; i++) {
    if (t.days[i].dow !== dow) continue;
    return (t.days[i].periods || []).map(function (p) { return p; })
      .filter(function (p) { return p; });
  }
  return [];
}

/* ── 홈: 타일 ────────────────────────────────────────── */
function viewHome() {
  var d = new Date();
  var h = '<div class="dayline">'

/* 문단 맨 앞 번호·기호 — 1. / 가. / 1) / 가) / ① / ○ - · ※ 등. 깊이를 정해 들여쓰고, 기호는 따로 떼어 내어쓰기 한다 */
var MARK = /^(\s*)(\d{1,2}\.|[가-힣]\.|\d{1,2}\)|[가-힣]\)|[①-⑳]|[○●◦ㅇ·∙•▶▷※\-*])\s+([\s\S]*)$/;

  if (/^\d{1,2}\.$/.test(mk)) return 0;

  if (/^[가-힣]\)$/.test(mk)) return 3;

  (links || []).forEach(function (L) {

}

    if (inCell) return '<p class="' + al + '">' + linkify(raw.replace(/^\s+/, ''), b.links) + '</p>';

    + (VIEW === 'home' ? '' : '<button type="button" class="back" data-go="home">‹</button>')
    + (VIEW === 'home' ? '<img class="logo" src="logo-512.png" alt="">' : '')
    + '<h1>' + esc(TITLES[VIEW] || '혜원이지') + '</h1>'
    + (VIEW === 'home'
      ? '<button type="button" class="act" data-go="set">설정</button>'
      : '')
    + '</div><div class="wrap">' + body + '</div>' + navHtml();
  wire();
}

function wire() {
  APP.querySelectorAll('[data-go]').forEach(function (b) {
    b.addEventListener('click', function () { VIEW = b.dataset.go; meQ = ''; draw(); window.scrollTo(0, 0); });
  });
  APP.querySelectorAll('[data-acm]').forEach(function (b) {
    b.addEventListener('click', function () { AC_M = b.dataset.acm; draw(); });
  });
  APP.querySelectorAll('[data-url]').forEach(function (b) {
    b.addEventListener('click', function () { window.open(b.dataset.url, '_blank', 'noopener'); });
  });
  APP.querySelectorAll('[data-me]').forEach(function (b) {
    b.addEventListener('click', function () {
      ME = b.dataset.me; LS.set('me', ME); VIEW = 'tt'; draw();
    });
  });
  var q = $('meQ');
  if (q) {
    /* ★ 한글을 넣는 도중에 다시 그리면 글자가 깨진다 — 조합이 끝난 뒤에만 그린다 */
    var composing = false;
    q.addEventListener('compositionstart', function () { composing = true; });
    q.addEventListener('compositionend', function () { composing = false; meQ = q.value; redrawKeep(q); });
    q.addEventListener('input', function () { if (!composing) { meQ = q.value; redrawKeep(q); } });
  }
  var g = $('gGo');
  if (g) {
    var go = function () {
      var v = ($('gKey').value || '').trim();
      if (!v) return;
      KEY = v; LS.set('key', v); ERR = ''; VIEW = 'home'; load();
    };
    g.addEventListener('click', go);
    $('gKey').addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    $('gKey').focus();
  }
  var r = $('reload');
  if (r) r.addEventListener('click', function () { load(true); });
  var f = $('forget');
  if (f) f.addEventListener('click', function () {
    LS.del('key'); KEY = ''; D = null; VIEW = 'gate'; draw();
  });
}
/* 검색칸만 다시 그리면 커서가 튄다 — 목록만 갈아 끼운다 */
function redrawKeep(q) {
  var box = APP.querySelector('.chips');
  if (!box || !D || !D.tt) return;
  var all = (D.tt.byTeacher || []).map(function (t) { return t.name; })
    .filter(function (n) { return n; });
  var s = meQ.trim();
  var hit = s ? all.filter(function (n) { return n.indexOf(s) >= 0; }) : all;
  box.innerHTML = hit.slice(0, 200).map(function (n) {
    return '<button type="button" class="chip' + (n === ME ? ' on' : '')
      + '" data-me="' + esc(n) + '">' + esc(n) + '</button>';
  }).join('');
  box.querySelectorAll('[data-me]').forEach(function (b) {
    b.addEventListener('click', function () {
      ME = b.dataset.me; LS.set('me', ME); VIEW = 'tt'; draw();
    });
  });
}

/* ══ 서비스워커 — 새 판을 «찾아보고» 스스로 바뀐다 ═══════════ */
(function () {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    /* 새 판을 찾아보는 일은 거절될 수 있다(file:// 로 열어 볼 때 등) — 조용히 넘어간다 */
    var up = function () { try { var p = reg.update(); if (p && p.catch) p.catch(function () {}); }
      catch (e) {} };
    up();                                                           // 열자마자
    document.addEventListener('visibilitychange', function () {     // 다시 앞으로 나올 때마다
      if (!document.hidden) up();
    });
    setInterval(up, 30 * 60 * 1000);                                 // 켜 둔 채로도 30분마다
    /* 새 판이 준비되면 통째로 새로고침하기 전에 한 번 알린다 —
       글을 보던 중에 화면이 저 혼자 바뀌면 놀란다 */
    reg.addEventListener('updatefound', function () {
      var sw = reg.installing;
      if (!sw) return;
      sw.addEventListener('statechange', function () {
        if (sw.state === 'installed' && navigator.serviceWorker.controller) {
          $('newver').style.display = 'flex';
        }
      });
    });
  }).catch(function () { /* file:// 로 열어 볼 때는 등록이 안 된다 — 화면은 멀쩡히 돈다 */ });
  var refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (refreshing) return; refreshing = true; location.reload();
  });
  $('nvBtn').addEventListener('click', function () { location.reload(); });
})();

/* ══ 시작 ═══════════════════════════════════════════════ */
(function () {
  var c = LS.get('cache', '');
  if (c) { try { D = JSON.parse(c); } catch (e) {} }   // 먼저 지난 것을 보여 준다
  if (!KEY) { VIEW = 'gate'; draw(); }
  else { draw(); load(); }
  /* 앱을 다시 앞으로 꺼낼 때 자료도 같이 새로 받는다 */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && KEY && !LOADING) load();
  });
})();
</script>
